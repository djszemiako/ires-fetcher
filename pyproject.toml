[project]
name = "ires-fetch"
version = "0.1.0"
description = "Fetch the FDA iRES (Enforcement Reports) API in full and keep every response verbatim as parquet."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
ires-fetch = "ires_fetch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "sqlfluff>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ires_fetch"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]
